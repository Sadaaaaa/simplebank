# Kubernetes configuration for auth-server
spring.application.name=auth-server

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql:5432/simplebank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server configuration
server.port=${SERVER_PORT:9000}

# OAuth2 configuration
authserver.issuer=${AUTHSERVER_ISSUER:http://auth-server:9000}
authserver.redirect=${AUTHSERVER_REDIRECT:http://front-ui:8080}

# Session configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/ 