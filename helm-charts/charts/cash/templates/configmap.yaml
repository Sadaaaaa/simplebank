apiVersion: v1
kind: ConfigMap
metadata:
  name: cash-config
  namespace: simplebank
data:
  application.properties: |
    server.port=8083
    
    # Actuator configuration
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    
    spring.datasource.url=${DB_URL}
    spring.datasource.username=${DB_USERNAME}
    spring.datasource.password=${DB_PASSWORD}
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    spring.jpa.generate-ddl=true
    
    spring.jpa.properties.hibernate.default_schema=cash_schema
    spring.jpa.hibernate.ddl-auto=none
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    
    # SQL initialization configuration
    spring.sql.init.mode=always
    spring.sql.init.schema-locations=classpath:schema.sql
    spring.sql.init.data-locations=classpath:data.sql
    spring.jpa.defer-datasource-initialization=true
    
    # Gateway URL for notifications
    gateway.url=http://gateway-service:8081
    
    # Auth server config
    auth.server.url=http://auth-server-service:9000
    auth.client.id=${OAUTH2_CLIENT_ID}
    auth.client.secret=${OAUTH2_CLIENT_SECRET}
    
    spring.security.oauth2.client.registration.auth-server.client-id=${OAUTH2_CLIENT_ID}
    spring.security.oauth2.client.registration.auth-server.client-secret=${OAUTH2_CLIENT_SECRET}
    spring.security.oauth2.client.registration.auth-server.authorization-grant-type=client_credentials
    spring.security.oauth2.client.registration.auth-server.scope=read,write
    
    spring.security.oauth2.client.provider.auth-server.token-uri=http://auth-server-service:9000/oauth2/token

