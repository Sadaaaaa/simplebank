apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-db-secret
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.config.database.password | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-oauth-secret
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.config.auth.server.client.secret | b64enc }}
