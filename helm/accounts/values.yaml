replicaCount: 1

image:
  repository: accounts
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: accounts.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
  
# Database configuration
database:
  url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"
  username: "postgres"
  password: "postgres"

# OAuth2 configuration
oauth2:
  authServerUrl: "http://auth-server:9000"
  clientId: "accounts-client"
  clientSecret: "accounts-secret"
