replicaCount: 1

image:
  repository: auth-server
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 9000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Application specific configuration
app:
  profile: "prod"
  
# Database configuration
database:
  url: "jdbc:postgresql://postgresql:5432/simplebank_db"
  username: "postgres"
  password: "postgres"
