apiVersion: v1
kind: ConfigMap
metadata:
  name: blocker-config
  namespace: simplebank
data:
  application.properties: |
    server.port=8087

    # Auth server config
    auth.server.url=http://auth-server-service:9000
    auth.client.id=blocker-client
    auth.client.secret=blocker-secret

    spring.security.oauth2.client.registration.auth-server.client-id=blocker-client
    spring.security.oauth2.client.registration.auth-server.client-secret=blocker-secret
    spring.security.oauth2.client.registration.auth-server.authorization-grant-type=client_credentials
    spring.security.oauth2.client.registration.auth-server.scope=read,write

    spring.security.oauth2.client.provider.auth-server.token-uri=http://auth-server-service:9000/oauth2/token


