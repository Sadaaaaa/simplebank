replicaCount: 1

image:
  repository: exchange-generator
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: exchange-generator.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# OAuth2 configuration
oauth2:
  authServerUrl: "http://auth-server:9000"
  clientId: "exchange-generator-client"
  clientSecret: "exchange-generator-secret"