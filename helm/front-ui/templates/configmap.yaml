apiVersion: v1
kind: ConfigMap
metadata:
  name: front-ui-config
  namespace: simplebank
data:
  application.properties: |
    server.port=8080
    
    # Actuator configuration
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    
    # Gateway URL for API calls
    gateway.url=http://gateway-service:8081
    
    # Auth server config
    auth.server.url=http://auth-server-service:9000
    
    # OAuth2 Client Configuration
    spring.security.oauth2.client.registration.gateway-client.client-id=${OAUTH2_CLIENT_ID}
    spring.security.oauth2.client.registration.gateway-client.client-secret=${OAUTH2_CLIENT_SECRET}
    spring.security.oauth2.client.registration.gateway-client.authorization-grant-type=authorization_code
    spring.security.oauth2.client.registration.gateway-client.redirect-uri=http://front-ui-service:8080/login/oauth2/code/gateway-client
    spring.security.oauth2.client.registration.gateway-client.scope=openid,read,write
    
    spring.security.oauth2.client.provider.gateway-client.authorization-uri=http://auth-server-service:9000/oauth2/authorize
    spring.security.oauth2.client.provider.gateway-client.token-uri=http://auth-server-service:9000/oauth2/token
    spring.security.oauth2.client.provider.gateway-client.user-info-uri=http://auth-server-service:9000/userinfo


