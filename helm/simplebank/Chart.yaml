apiVersion: v2
name: simplebank
description: A Helm umbrella chart for SimpleBank microservices application
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "16.7.26"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: accounts
    version: "0.1.0"
    repository: "file://../accounts"
    condition: accounts.enabled
  - name: cash
    version: "0.1.0"
    repository: "file://../cash"
    condition: cash.enabled
  - name: exchange
    version: "0.1.0"
    repository: "file://../exchange"
    condition: exchange.enabled
  - name: transfer
    version: "0.1.0"
    repository: "file://../transfer"
    condition: transfer.enabled
  - name: notifications
    version: "0.1.0"
    repository: "file://../notifications"
    condition: notifications.enabled
  - name: gateway
    version: "0.1.0"
    repository: "file://../gateway"
    condition: gateway.enabled
  - name: auth-server
    version: "0.1.0"
    repository: "file://../auth-server"
    condition: authServer.enabled
  - name: front-ui
    version: "0.1.0"
    repository: "file://../front-ui"
    condition: frontUi.enabled
  - name: blocker
    version: "0.1.0"
    repository: "file://../blocker"
    condition: blocker.enabled
  - name: exchange-generator
    version: "0.1.0"
    repository: "file://../exchange-generator"
    condition: exchangeGenerator.enabled
  - name: ingress-nginx
    version: "4.10.1"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingressNginx.enabled
