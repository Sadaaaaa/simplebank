# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres"
    username: "postgres"
    password: "postgres"
    database: "simplebank_db"
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Microservices configuration
accounts:
  enabled: true
  service:
    port: 8082
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

cash:
  enabled: true
  service:
    port: 8083
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

exchange:
  enabled: true
  service:
    port: 8086
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

transfer:
  enabled: true
  service:
    port: 8084
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

authServer:
  enabled: true
  service:
    port: 9000
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

gateway:
  service:
    type: ClusterIP
    port: 8081
  ingress:
    enabled: false

front-ui:
  replicaCount: 1
  image:
    repository: front-ui
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: NodePort
    port: 8080
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: simplebank.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  serviceAccount:
    create: true
    name: ""
    automount: true
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

exchangeGenerator:
  enabled: true
  service:
    port: 8085

blocker:
  enabled: true
  service:
    port: 8087

# Ingress controller dependency (ingress-nginx)
ingressNginx:
  enabled: false
  controller:
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb

