# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres"
    username: "postgres"
    password: "postgres"
    database: "simplebank_db"
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Microservices configuration
accounts:
  enabled: true
  service:
    port: 8082
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

cash:
  enabled: true
  service:
    port: 8083
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

exchange:
  enabled: true
  service:
    port: 8086
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

transfer:
  enabled: true
  service:
    port: 8084
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

authServer:
  enabled: true
  service:
    port: 9000
  database:
    url: "jdbc:postgresql://simplebank-postgresql:5432/simplebank_db"

gateway:
  service:
    type: ClusterIP
    port: 8081
  ingress:
    enabled: false

frontUi:
  replicaCount: 1
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: simplebank.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  serviceAccount:
    create: true
    name: ""
    automount: true
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

front-ui:
  replicaCount: 1
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: simplebank.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  serviceAccount:
    create: true
    name: ""
    automount: true
    annotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

exchangeGenerator:
  enabled: true
  service:
    port: 8085

blocker:
  enabled: true
  service:
    port: 8087

# Ingress controller dependency (ingress-nginx)
ingressNginx:
  enabled: false
  controller:
    service:
      type: LoadBalancer

