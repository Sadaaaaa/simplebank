# Kubernetes configuration for notifications
spring.application.name=notifications

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql:5432/simplebank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=notifications_schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server configuration
server.port=${SERVER_PORT:8080}

# OAuth2 configuration
auth.server.url=${AUTH_SERVER_URL:http://auth-server:9000}

# OAuth2 Client configuration
spring.security.oauth2.client.registration.auth-server.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH_SERVER_CLIENT_ID:notifications-client}
spring.security.oauth2.client.registration.auth-server.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTH_SERVER_CLIENT_SECRET:notifications-secret}
spring.security.oauth2.client.registration.auth-server.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.auth-server.scope=read,write

spring.security.oauth2.client.provider.auth-server.token-uri=${AUTH_SERVER_URL:http://auth-server:9000}/oauth2/token

# Gateway configuration
gateway.url=${GATEWAY_URL:http://gateway:8081}

# Session configuration
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
